[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Keep links to the previous Wix site working.
[[redirects]]
  from = "/team"
  to = "/who-we-are#board"
  status = 301

[[redirects]]
  from = "/events-1/fleet-week-2026"
  to = "/events/fleet-week-2026"
  status = 301

[[redirects]]
  from = "/events-1/*"
  to = "/events"
  status = 301

[[redirects]]
  from = "/about-test"
  to = "/about"
  status = 301

[[redirects]]
  from = "/donate"
  to = "/support-us"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
